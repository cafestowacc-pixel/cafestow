<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Calendar</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Using Inter font */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Add a custom style for the day headers to ensure they are consistent */
        .day-header {
            font-size: 0.75rem; /* text-xs */
            font-weight: 600; /* font-semibold */
            color: #4b5563; /* text-gray-600 */
            text-align: center;
        }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl md:text-5xl font-bold text-center text-gray-800 mb-8 md:mb-12">
            2026 Calendar
        </h1>

        <!-- Container for all the month calendars -->
        <div id="calendar-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
            <!-- Calendar months will be injected here by JavaScript -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const calendarContainer = document.getElementById('calendar-container');
            
            // Define month data for 2026. 2026 is NOT a leap year.
            const months_2026 = [
                { name: 'January', days: 31, year: 2026, monthIndex: 0 },
                { name: 'February', days: 28, year: 2026, monthIndex: 1 },
                { name: 'March', days: 31, year: 2026, monthIndex: 2 },
                { name: 'April', days: 30, year: 2026, monthIndex: 3 },
                { name: 'May', days: 31, year: 2026, monthIndex: 4 },
                { name: 'June', days: 30, year: 2026, monthIndex: 5 },
                { name: 'July', days: 31, year: 2026, monthIndex: 6 },
                { name: 'August', days: 31, year: 2026, monthIndex: 7 },
                { name: 'September', days: 30, year: 2026, monthIndex: 8 },
                { name: 'October', days: 31, year: 2026, monthIndex: 9 },
                { name: 'November', days: 30, year: 2026, monthIndex: 10 },
                { name: 'December', days: 31, year: 2026, monthIndex: 11 }
            ];

            const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

            // Loop through each month and generate its HTML
            months_2026.forEach(month => {
                const monthCard = document.createElement('div');
                monthCard.className = 'bg-white p-4 rounded-lg shadow-lg';
                
                // --- Generate HTML for the month ---
                let html = `<h2 class="text-xl font-bold text-center text-indigo-700 mb-4">${month.name} ${month.year}</h2>`;
                
                // Day of Week Headers
                html += '<div class="grid grid-cols-7 gap-1 mb-2">';
                daysOfWeek.forEach((day, index) => {
                    // Make Sunday (index 0) red
                    const headerClass = (index === 0) ? 'text-red-600' : 'text-gray-600';
                    html += `<div class="day-header ${headerClass}">${day}</div>`;
                });
                html += '</div>';

                // Days Grid
                html += '<div class="grid grid-cols-7 gap-1">';
                
                // Get the first day of the month (0=Sun, 1=Mon, ..., 6=Sat)
                // Jan 1, 2026 is a Thursday (index 4)
                const firstDay = new Date(month.year, month.monthIndex, 1).getDay();
                
                // 1. Add empty cells for days before the 1st
                for (let i = 0; i < firstDay; i++) {
                    html += `<div class="p-2 text-center"></div>`;
                }
                
                // 2. Add the actual days
                for (let day = 1; day <= month.days; day++) {
                    // Check if the day is a Sunday (cell index % 7 === 0)
                    const dayIndex = (firstDay + day - 1) % 7;
                    const dayClass = (dayIndex === 0) ? 'text-red-600' : 'text-gray-800';
                    
                    html += `<div class="p-2 text-center rounded-full text-sm ${dayClass} font-medium">${day}</div>`;
                }
                
                html += '</div>'; // Close days grid
                // --- End of HTML generation ---
                
                monthCard.innerHTML = html;
                calendarContainer.appendChild(monthCard);
            });
        });
    </script>
</body>
</html>
